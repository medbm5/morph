name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libx11-dev libxi-dev libxext-dev libxcb1-dev exiftool
      - name: Fetch PDFium and FFmpeg, build the Explorer extension
        shell: bash
        run: |
          python3 scripts/fetch_pdfium.py
          python3 scripts/fetch_ffmpeg.py
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build -p morph-shell && mkdir -p vendor/shell && cp target/debug/morph_shell.dll vendor/shell/
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        shell: bash
        run: |
          python3 scripts/fetch_pdfium.py
          python3 scripts/fetch_ffmpeg.py
          cargo run -q -p morph-cli -- component install ffmpeg
          cargo run -q -p morph-cli -- component install pandoc
          cargo test --workspace
      - name: DOCX opens in LibreOffice
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 scripts/check_docx_libreoffice.py
      - name: CLI version matches app version
        shell: bash
        run: |
          cli=$(cargo run -q -p morph-cli -- --version | awk '{print $2}')
          app=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='metamorphosis'))")
          test "$cli" = "$app"

  offline-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail on network crates outside the updater
        run: python3 scripts/offline_guard.py

  hud:
    name: HUD gallery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npx playwright install --with-deps chromium webkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Visual snapshots, reduced motion, forced colours, offline fonts
        working-directory: app
        run: node tests/visual.mjs
      - name: Photo editor preview matches export (ΔE < 2)
        working-directory: app
        run: node tests/adjust-parity.mjs
      - name: Settings page saves, warns on low contrast, translates
        working-directory: app
        run: node tests/settings-page.mjs

  ml:
    name: Local AI (network disabled)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install components (checksums verified)
        run: |
          cargo run -q -p morph-cli -- component install ml
          cargo run -q -p morph-cli -- component install ocr
          cargo run -q -p morph-cli -- component install bgremove
      - name: Build tests
        run: cargo test -p morph-engines --test ml_detection --no-run
      - name: Detection suite with no network
        run: |
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            cargo test -p morph-engines --test ml_detection --offline -- --nocapture
