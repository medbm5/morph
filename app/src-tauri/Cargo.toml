[package]
name = "metamorphosis"
description = "Metamorphosis — drag, tap a key, drop on the ring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "metamorphosis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
morph-core.workspace = true
morph-engines.workspace = true
morph-input-watch.workspace = true
morph-platform.workspace = true
morph-updater.workspace = true
log.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
drag = "2"
rfd = "0.17"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
cairo-rs = "0.18"
