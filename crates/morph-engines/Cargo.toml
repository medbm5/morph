[package]
name = "morph-engines"
description = "Conversion and editing engines for Metamorphosis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["image", "pdf", "ml", "media", "office", "archive"]
image = ["dep:image", "dep:webp", "dep:resvg", "dep:lopdf", "dep:oxipng", "dep:kamadak-exif", "dep:little_exif", "dep:rayon"]
pdf = ["image", "dep:pdfium-render", "dep:docx-rs"]
ml = ["image", "dep:ort"]
media = []
archive = ["dep:zip", "dep:tar", "dep:sevenz-rust2"]
office = ["pdf", "dep:calamine", "dep:rust_xlsxwriter", "dep:csv", "dep:zip"]

[dependencies]
morph-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif", "ico", "avif", "rayon"] }
webp = { version = "0.3", optional = true, default-features = false }
resvg = { version = "0.45", optional = true }
lopdf = { version = "0.38", optional = true }
pdfium-render = { version = "0.9", optional = true }
oxipng = { version = "10", optional = true, default-features = false, features = ["parallel"] }
kamadak-exif = { version = "0.6", optional = true }
little_exif = { version = "0.6", optional = true }
rayon = { version = "1", optional = true }
calamine = { version = "0.30", optional = true }
rust_xlsxwriter = { version = "0.89", optional = true }
csv = { version = "1", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
tar = { version = "0.4", optional = true }
sevenz-rust2 = { version = "0.20", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
docx-rs = { version = "0.4", optional = true }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.45"
little_exif = "0.6"
lopdf = "0.38"
tar = "0.4"
sevenz-rust2 = "0.20"
pdfium-render = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
